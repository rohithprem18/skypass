<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 170" width="1280" height="170" role="img" aria-label="Clear skies">
<title>Clear skies</title>
<style>.tw{animation:tw 4.5s ease-in-out infinite;opacity:.35}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
.cl{opacity:.13;animation:cl 40s ease-in-out infinite alternate}
@keyframes cl{from{transform:translateX(-60px)}to{transform:translateX(90px)}}
.ping{fill:none;stroke:#b9f06a;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:ping 3.2s ease-out infinite}
.p2{animation-delay:1.6s}
@keyframes ping{0%{transform:scale(.6);opacity:.95}100%{transform:scale(6.5);opacity:0}}
text{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:24px;font-weight:600;fill:#f5f7fa}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
<radialGradient id="sky" cx="50%" cy="100%" r="85%"><stop offset="0" stop-color="#0d2a14"/><stop offset=".55" stop-color="#070d10"/><stop offset="1" stop-color="#030507"/></radialGradient>
<radialGradient id="earth" cx="50%" cy="0%" r="65%"><stop offset="0" stop-color="#123a4c"/><stop offset=".3" stop-color="#0a2231"/><stop offset="1" stop-color="#050c12"/></radialGradient>
<radialGradient id="halo"><stop offset="0" stop-color="#76b900" stop-opacity=".55"/><stop offset="1" stop-color="#76b900" stop-opacity="0"/></radialGradient>
<linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#76b900" stop-opacity="0"/><stop offset="1" stop-color="#c6f25a"/></linearGradient>
<filter id="b6" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="b14" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<clipPath id="card"><rect width="1280" height="170" rx="22"/></clipPath>
<clipPath id="globe"><circle cx="640.0" cy="900" r="830"/></clipPath>
</defs>
<g clip-path="url(#card)">
<rect width="1280" height="170" fill="url(#sky)"/>
<g fill="#fff"><circle class="tw" cx="236" cy="63" r="1.7" style="animation-delay:4.8s"/><circle class="tw" cx="120" cy="37" r="0.6" style="animation-delay:3.2s"/><circle class="tw" cx="1140" cy="78" r="1.7" style="animation-delay:5.9s"/><circle class="tw" cx="1235" cy="80" r="1.7" style="animation-delay:3.9s"/><circle class="tw" cx="76" cy="23" r="0.8" style="animation-delay:3.6s"/><circle class="tw" cx="996" cy="40" r="1.7" style="animation-delay:5.1s"/><circle class="tw" cx="6" cy="10" r="1.0" style="animation-delay:2.4s"/><circle class="tw" cx="656" cy="4" r="1.7" style="animation-delay:4.6s"/><circle class="tw" cx="86" cy="2" r="0.6" style="animation-delay:1.3s"/><circle class="tw" cx="1187" cy="6" r="1.3" style="animation-delay:5.9s"/><circle class="tw" cx="509" cy="9" r="0.8" style="animation-delay:4.7s"/><circle class="tw" cx="345" cy="11" r="1.0" style="animation-delay:0.1s"/><circle class="tw" cx="315" cy="12" r="0.6" style="animation-delay:2.8s"/><circle class="tw" cx="573" cy="23" r="0.8" style="animation-delay:2.5s"/><circle class="tw" cx="1" cy="106" r="1.7" style="animation-delay:1.8s"/><circle class="tw" cx="1133" cy="26" r="1.3" style="animation-delay:6.0s"/><circle class="tw" cx="1266" cy="26" r="1.0" style="animation-delay:0.1s"/><circle class="tw" cx="94" cy="11" r="1.7" style="animation-delay:3.8s"/><circle class="tw" cx="20" cy="45" r="1.7" style="animation-delay:2.7s"/><circle class="tw" cx="1228" cy="59" r="1.7" style="animation-delay:0.8s"/><circle class="tw" cx="1163" cy="100" r="0.8" style="animation-delay:4.4s"/><circle class="tw" cx="203" cy="77" r="1.7" style="animation-delay:1.2s"/><circle class="tw" cx="1216" cy="108" r="1.7" style="animation-delay:0.5s"/><circle class="tw" cx="61" cy="13" r="1.7" style="animation-delay:5.8s"/><circle class="tw" cx="376" cy="21" r="0.6" style="animation-delay:0.8s"/><circle class="tw" cx="959" cy="8" r="1.3" style="animation-delay:2.7s"/><circle class="tw" cx="77" cy="22" r="1.0" style="animation-delay:3.2s"/><circle class="tw" cx="1246" cy="11" r="0.8" style="animation-delay:5.3s"/><circle class="tw" cx="1255" cy="80" r="1.7" style="animation-delay:3.5s"/><circle class="tw" cx="180" cy="4" r="0.6" style="animation-delay:2.8s"/><circle class="tw" cx="27" cy="78" r="1.3" style="animation-delay:0.4s"/><circle class="tw" cx="398" cy="17" r="0.6" style="animation-delay:0.5s"/></g>
<circle cx="640.0" cy="900" r="837" fill="none" stroke="#5fd0ff" stroke-opacity=".45" stroke-width="16" filter="url(#b14)"/>
<circle cx="640.0" cy="900" r="832" fill="none" stroke="#76b900" stroke-opacity=".95" stroke-width="2.5" filter="url(#b6)"/>
<circle cx="640.0" cy="900" r="830" fill="url(#earth)" stroke="#b9f06a" stroke-opacity=".75" stroke-width="1.2"/>
<g clip-path="url(#globe)"><ellipse cx="640.0" cy="900" rx="166" ry="830" fill="none" stroke="#76b900" stroke-opacity=".10"/><ellipse cx="640.0" cy="900" rx="374" ry="830" fill="none" stroke="#76b900" stroke-opacity=".10"/><ellipse cx="640.0" cy="900" rx="581" ry="830" fill="none" stroke="#76b900" stroke-opacity=".10"/><ellipse cx="640.0" cy="900" rx="747" ry="830" fill="none" stroke="#76b900" stroke-opacity=".10"/><ellipse cx="640.0" cy="103" rx="232" ry="83" fill="none" stroke="#76b900" stroke-opacity=".08"/><ellipse cx="640.0" cy="153" rx="362" ry="83" fill="none" stroke="#76b900" stroke-opacity=".08"/><ellipse cx="640.0" cy="219" rx="475" ry="83" fill="none" stroke="#76b900" stroke-opacity=".08"/><g fill="#dcebf5" filter="url(#b6)"><ellipse class="cl" cx="204.8" cy="124" rx="150" ry="13" style="animation-duration:34s"/><ellipse class="cl" cx="665.6" cy="104" rx="190" ry="12" style="animation-duration:46s"/><ellipse class="cl" cx="1100.8" cy="140" rx="170" ry="15" style="animation-duration:40s"/><ellipse class="cl" cx="435.20000000000005" cy="156" rx="130" ry="11" style="animation-duration:52s"/></g></g>
<g transform="translate(420 100)"><circle class="ping" r="5"/><circle class="ping p2" r="5"/><circle r="3.6" fill="#d8ff8a"/></g>
<path id="orbit" d="M -60 118 Q 640 8 1340 118" fill="none" stroke="#fff" stroke-opacity=".20" stroke-dasharray="2 7"/>
<path d="M -60 118 Q 640 8 1340 118" pathLength="1000" fill="none" stroke="#c6f25a" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="120 1300" stroke-dashoffset="120"><animate attributeName="stroke-dashoffset" from="120" to="-880" dur="18s" repeatCount="indefinite"/></path>
<g><g><rect x="-6" y="-4" width="12" height="8" rx="1.5" fill="#e8edf2"/><rect x="-24" y="-3.5" width="15" height="7" fill="#2f6fb3" stroke="#9cc4ea" stroke-width=".6"/><rect x="9" y="-3.5" width="15" height="7" fill="#2f6fb3" stroke="#9cc4ea" stroke-width=".6"/><rect x="-9" y="-.7" width="3" height="1.4" fill="#cfd8e1"/><rect x="6" y="-.7" width="3" height="1.4" fill="#cfd8e1"/><circle r="16" fill="url(#halo)"/></g><animateMotion dur="18s" repeatCount="indefinite" rotate="auto"><mpath href="#orbit"/></animateMotion></g>
<text x="640" y="62" text-anchor="middle">Clear skies.</text>
</g></svg>