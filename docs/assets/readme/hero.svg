<style>.tw{animation:tw 4.5s ease-in-out infinite;opacity:.35}
@keyframes tw{0%,100%{opacity:.18}50%{opacity:1}}
.cl{opacity:.13;animation:cl 40s ease-in-out infinite alternate}
@keyframes cl{from{transform:translateX(-60px)}to{transform:translateX(90px)}}
.ping{fill:none;stroke:#b9f06a;stroke-width:1.6;transform-box:fill-box;transform-origin:center;animation:ping 3.2s ease-out infinite}
.p2{animation-delay:1.6s}
@keyframes ping{0%{transform:scale(.6);opacity:.95}100%{transform:scale(6.5);opacity:0}}
text{font-family:'Inter','Segoe UI','Helvetica Neue',Arial,sans-serif}
.eye{font-size:14px;font-weight:700;letter-spacing:.24em;fill:#b5e853}
.logo{font-size:92px;font-weight:800;letter-spacing:-.02em}
.tag{font-size:27px;font-weight:600;fill:#f5f7fa}
.rot{font-size:18px;fill:#a3adba;opacity:0;animation:rot 16s ease-in-out infinite}
@keyframes rot{0%{opacity:0;transform:translateY(7px)}4%,21%{opacity:1;transform:translateY(0)}25%,100%{opacity:0;transform:translateY(-7px)}}
.in{animation:in 1.1s cubic-bezier(.2,.7,.2,1) both}
.d2{animation-delay:.18s}.d3{animation-delay:.36s}
@keyframes in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
