[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skypass"
version = "1.0.0"
description = "Weather-aware integrated satellite transit planning and observation system"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Rohith Prem S", email = "rohithprem91@gmail.com" },
  { name = "R. Selvakumar", email = "selvakumarr@saveetha.ac.in" },
]
keywords = ["satellite", "SGP4", "TLE", "ground station", "scheduling", "weather"]
dependencies = ["sgp4>=2.23"]

[project.optional-dependencies]
experiments = ["numpy>=1.24", "matplotlib>=3.7", "skyfield>=1.46"]

[project.scripts]
skypass = "skypass.cli:main"

[tool.setuptools]
packages = ["skypass"]
