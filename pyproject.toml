[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "skypass"
version = "2.0.0"
description = "Weather-aware satellite pass planning with learned cloud nowcasting and brightness prediction"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "Rohith Prem S", email = "rohithprem91@gmail.com" },
  { name = "R. Selvakumar", email = "selvakumarr@saveetha.ac.in" },
]
keywords = ["satellite", "SGP4", "TLE", "ground station", "scheduling", "weather",
            "machine learning", "cloud segmentation"]
dependencies = ["sgp4>=2.23"]

[project.optional-dependencies]
experiments = ["numpy>=1.24", "matplotlib>=3.7", "skyfield>=1.46"]
# learned components (skypass.ml); torch is needed only for the cloud U-Net
ml = ["numpy>=1.24", "pandas>=2.0", "scikit-learn>=1.3", "Pillow>=10.0", "torch>=2.2"]

[project.scripts]
skypass = "skypass.cli:main"

[tool.setuptools]
packages = ["skypass", "skypass.ml"]
